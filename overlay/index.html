<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="./renderer.css">
<div id="compact-island" aria-label="Dynamic Island do Pip">
  <canvas id="c" width="640" height="250"></canvas>
  <button id="island-collapse" type="button" aria-label="Recolher Pip para a linha superior" title="Recolher Pip">⌃</button>
  <button id="island-pet-button" type="button" aria-label="Abrir conversa com Pip" title="Abrir conversa com Pip"></button>
  <div id="island-media" aria-live="polite">
    <span id="island-track"><strong id="island-title"></strong><span id="island-artist"></span></span>
    <span id="island-status"></span>
  </div>
  <div id="island-notification" aria-live="polite"></div>
  <div id="drop-hint">Solte para anexar ao Pip</div>
</div>
<div id="bubble"></div>
<section id="chat" aria-label="Conversa com o Pip">
  <div id="chat-head">
    <div id="chat-nav">
      <button id="chat-close" type="button" aria-label="Recolher Pip" title="Recolher">⌂</button>
      <span id="chat-current" aria-label="Conversa atual"><span class="chat-bubble-icon"></span></span>
      <button id="chat-new" type="button" aria-label="Nova conversa" title="Nova conversa">＋</button>
      <button id="chat-history" type="button" aria-label="Conversas salvas" title="Conversas salvas">◷</button>
      <button id="chat-demo" type="button" aria-label="Testar animações do Pip" aria-pressed="false" title="Testar animações">▶</button>
      <button id="chat-attach" type="button" aria-label="Anexar arquivos" title="Anexar arquivos">↥</button>
    </div>
    <div id="chat-actions"><button id="chat-settings" type="button" aria-label="Abrir configurações" title="Configurações">⚙</button></div>
  </div>
  <div id="chat-stage">
    <div id="chat-transcript" role="log" aria-live="polite" aria-label="Histórico da conversa"></div>
    <div id="chat-message" aria-live="polite"></div>
    <div id="attachments" aria-label="Arquivos anexados"></div>
    <form id="chat-form">
      <textarea id="chat-input" rows="1" maxlength="2000" aria-label="Sua pergunta" placeholder="Escreva sua pergunta…"></textarea>
      <button id="chat-send" type="submit" aria-label="Enviar pergunta" title="Enviar pergunta">↑</button>
    </form>
    <div id="chat-history-panel" hidden aria-label="Conversas salvas">
      <h2 id="chat-history-title">Conversas recentes</h2>
      <div id="chat-history-list"></div>
    </div>
  </div>
</section>
<script src="./pet-graphics.js"></script>
<script src="./renderer.js"></script>
