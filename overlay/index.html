<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
  :root{--panel:#17181d;--panel-raised:#24252a;--border:#2b2c32;--text:#f0f0f2;--muted:#a7a8af;--accent:#f2f2f5;--accent-ink:#17181d}
  html,body{margin:0;background:transparent;overflow:hidden;font:14px/1.45 "Segoe UI",sans-serif}
  canvas{position:absolute;left:0;top:0;width:640px;height:250px;z-index:2;pointer-events:none}
  #compact-island{position:absolute;z-index:1;left:50%;top:0;width:78px;height:6px;box-sizing:border-box;transform:translateX(-50%);overflow:hidden;
    border:1px solid #121317;border-top:0;border-radius:0 0 5px 5px;background:#030405;box-shadow:0 3px 12px #0008;cursor:pointer;
    transition:width 220ms ease,height 220ms ease,border-radius 220ms ease,padding 220ms ease}
  body.island-expanded #compact-island{width:128px;height:66px;min-height:66px;padding:0;border-radius:0 0 14px 14px}
  body.island-expanded.has-notification #compact-island{width:420px;height:96px;min-height:96px;padding:0;border-radius:0 0 14px 14px}
  body.media-available.island-expanded:not(.has-notification) #compact-island{width:310px;height:66px;min-height:66px;padding:0;border-radius:0 0 14px 14px}
  body.file-dragging #compact-island{width:310px;height:66px;min-height:66px;padding:0;border-radius:0 0 14px 14px}
  body.media-playing.island-expanded #compact-island{box-shadow:0 10px 28px #0008}
  #island-collapse{position:absolute;z-index:4;top:8px;right:9px;display:none;place-items:center;width:24px;height:24px;padding:0;
    border:0;border-radius:7px;background:#ffffff0d;color:#c4c5cb;font:600 17px/1 "Segoe UI",sans-serif;cursor:pointer}
  body.island-expanded #island-collapse{display:grid}
  #island-collapse:hover{background:#ffffff20;color:#fff}
  #island-collapse:focus-visible{outline:2px solid #f0f0f2;outline-offset:2px}
  #island-media{position:relative;z-index:1;display:none;align-items:center;gap:12px;box-sizing:border-box;min-width:0;height:100%;padding-left:100px;color:var(--text)}
  body.media-available #island-media{display:flex}
  body.file-dragging #island-media{opacity:0}
  #island-pet-button{position:absolute;z-index:3;top:0;left:0;display:none;width:80px;height:66px;padding:0;border:0;background:transparent;cursor:pointer}
  body.island-expanded.media-available #island-pet-button{display:block}
  #island-track{display:flex;flex:1;min-width:0;flex-direction:column;line-height:1.3}
  #island-title,#island-artist{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #island-title{font-size:12px;font-weight:600;color:#f3f3f4}
  #island-artist{font-size:11px;color:#a7a8af}
  #island-status{flex:none;margin-right:30px;color:#a7a8af;font-size:10px}
  #island-notification{display:none;max-height:48px;overflow:hidden;margin-top:7px;padding:8px 42px 8px 100px;border-top:1px solid #ffffff18;
    color:#e8e8eb;font-size:12px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
  #drop-hint{position:absolute;z-index:5;right:38px;bottom:7px;left:100px;padding:6px 8px;border:1px solid #515260;border-radius:9px;
    background:#17181d;color:var(--text);text-align:center;font-size:12px;pointer-events:none;display:none}
  body.file-dragging #drop-hint{display:block}
  body.has-notification #island-notification{display:block}
  body:not(.island-expanded) #island-media,body:not(.island-expanded) #island-notification{display:none}
  body.chat-open #compact-island{display:none}
  #bubble{display:none}
  #chat{position:absolute;z-index:1;left:0;right:0;top:0;bottom:8px;box-sizing:border-box;padding:7px 9px 9px;
    border:1px solid #090a0c;border-radius:18px;background:#030405;color:var(--text);display:none;flex-direction:column;overflow:hidden;
    box-shadow:inset 0 1px #ffffff08}
  body.chat-open #chat{display:flex}
  #chat-head{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px}
  #chat-nav,#chat-actions{display:flex;align-items:center;gap:4px}
  #chat-close,#chat-new,#chat-history,#chat-attach,#chat-settings{display:grid;place-items:center;width:31px;height:29px;border:0;border-radius:9px;background:transparent;color:#c4c5cb;line-height:1;cursor:pointer}
  #chat-close{font-size:19px}
  #chat-new{font-size:17px}
  #chat-history{font-size:18px}
  #chat-attach{font-size:17px}
  #chat-settings{font-size:15px}
  #chat-close:hover,#chat-new:hover,#chat-history:hover,#chat-attach:hover,#chat-settings:hover{background:#ffffff12;color:#fff}
  #chat-close:focus-visible,#chat-new:focus-visible,#chat-history:focus-visible,#chat-attach:focus-visible,#chat-settings:focus-visible{outline:2px solid #f0f0f2;outline-offset:1px}
  #chat-current{display:grid;place-items:center;width:31px;height:24px;border-radius:14px;background:#25262b}
  .chat-bubble-icon{position:relative;width:12px;height:9px;border-radius:6px;background:#f1f1f3}
  .chat-bubble-icon::after{position:absolute;left:2px;bottom:-2px;width:4px;height:4px;background:#f1f1f3;content:"";clip-path:polygon(0 0,100% 0,0 100%)}
  #chat-stage{position:relative;display:flex;flex:1;min-height:0;flex-direction:column;gap:7px;overflow:hidden;padding:12px 14px 13px 85px;
    border-radius:15px;background:radial-gradient(ellipse at 52% 108%,#3d3e69 0%,#252631 32%,#17181d 68%)}
  body.chat-open.file-dragging #chat-stage::after{position:absolute;z-index:4;top:8px;left:85px;right:14px;padding:7px 9px;border:1px solid #515260;border-radius:8px;
    background:#17181d;color:var(--text);text-align:center;font-size:12px;content:"Solte para anexar ao Pip"}
  #chat-transcript{display:flex;flex:1 1 0;min-height:120px;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;padding:10px;border-radius:11px;background:#ffffff05;scrollbar-width:thin;scrollbar-color:#555660 transparent}
  .chat-entry{padding:7px 9px;margin:3px 0;border-radius:8px;background:#ffffff08;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
  .chat-entry-user{background:#ffffff0a}
  .chat-entry-pip{background:#ffffff05}
  .chat-entry-label{display:block;margin-bottom:2px;color:var(--muted);font-size:10px;font-weight:500}
  #chat-message{min-height:0;max-height:42px;overflow:auto;white-space:pre-wrap;font-size:11px;margin:0;color:var(--muted)}
  #chat-message:empty{display:none}
  #attachments{display:flex;flex-wrap:wrap;gap:6px}
  .attachment{display:flex;align-items:center;gap:6px;max-width:100%;padding:4px 7px 4px 9px;border-radius:7px;background:#ffffff0d;color:var(--text);font-size:12px}
  .attachment-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .attachment-remove{flex:none;border:0;background:transparent;color:#d4d4da;font-size:16px;line-height:1;cursor:pointer}
  #chat-form{display:flex;flex:none;gap:8px;align-items:center;min-height:40px;padding:4px 5px 4px 12px;border:1px solid #292a30;border-radius:14px;background:#24252a}
  #chat-input{box-sizing:border-box;flex:1;min-width:0;min-height:28px;max-height:56px;resize:none;border:0;background:transparent;
    color:var(--text);font:13px/1.4 "Segoe UI",sans-serif;padding:5px 0;outline:none}
  #chat-input::placeholder{color:#85868e}
  #chat-send{display:grid;place-items:center;flex:none;width:29px;height:29px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 17px/1 "Segoe UI",sans-serif;cursor:pointer}
  #chat-send[data-cancelling="false"]{width:auto;padding:0 11px;border-radius:16px;font:600 12px "Segoe UI",sans-serif}
  #chat-send[data-cancelling="true"]{width:auto;padding:0 11px;border-radius:16px;background:#d4d4da;font:600 12px "Segoe UI",sans-serif}
  #chat-send:disabled,#chat-close:disabled,#chat-new:disabled,#chat-history:disabled,#chat-attach:disabled{opacity:.55;cursor:default}
  #chat-history-panel{position:absolute;z-index:5;inset:9px 13px 10px 84px;display:flex;flex-direction:column;min-height:0;padding:12px;border:1px solid #3a3b43;border-radius:12px;background:#1b1c22}
  #chat-history-panel[hidden]{display:none}
  #chat-history-title{margin:0 0 8px;color:var(--text);font-size:13px;font-weight:600}
  #chat-history-list{display:flex;flex:1;min-height:0;flex-direction:column;gap:5px;overflow:auto}
  .history-empty{margin:auto;color:var(--muted);font-size:12px;text-align:center}
  .history-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:#ffffff08;color:var(--text);text-align:left;cursor:pointer}
  .history-item:hover{background:#ffffff15}
  .history-item-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
  .history-item-date{flex:none;color:var(--muted);font-size:10px}
</style>
<div id="compact-island" aria-label="Dynamic Island do Pip">
  <canvas id="c" width="640" height="250"></canvas>
  <button id="island-collapse" type="button" aria-label="Recolher Pip para a linha superior" title="Recolher Pip">⌃</button>
  <button id="island-pet-button" type="button" aria-label="Abrir conversa com Pip" title="Abrir conversa com Pip"></button>
  <div id="island-media" aria-live="polite">
    <span id="island-track"><strong id="island-title"></strong><span id="island-artist"></span></span>
    <span id="island-status"></span>
  </div>
  <div id="island-notification" aria-live="polite"></div>
  <div id="drop-hint">Solte para anexar ao Pip</div>
</div>
<div id="bubble"></div>
<section id="chat" aria-label="Conversa com o Pip">
  <div id="chat-head">
    <div id="chat-nav">
      <button id="chat-close" type="button" aria-label="Recolher Pip" title="Recolher">⌂</button>
      <span id="chat-current" aria-label="Conversa atual"><span class="chat-bubble-icon"></span></span>
      <button id="chat-new" type="button" aria-label="Nova conversa" title="Nova conversa">＋</button>
      <button id="chat-history" type="button" aria-label="Conversas salvas" title="Conversas salvas">◷</button>
      <button id="chat-attach" type="button" aria-label="Anexar arquivos" title="Anexar arquivos">↥</button>
    </div>
    <div id="chat-actions"><button id="chat-settings" type="button" aria-label="Abrir configurações" title="Configurações">⚙</button></div>
  </div>
  <div id="chat-stage">
    <div id="chat-transcript" role="log" aria-live="polite" aria-label="Histórico da conversa"></div>
    <div id="chat-message" aria-live="polite"></div>
    <div id="attachments" aria-label="Arquivos anexados"></div>
    <form id="chat-form">
      <textarea id="chat-input" rows="1" maxlength="2000" aria-label="Sua pergunta" placeholder="Escreva sua pergunta…"></textarea>
      <button id="chat-send" type="submit" aria-label="Enviar pergunta" title="Enviar pergunta">↑</button>
    </form>
    <div id="chat-history-panel" hidden aria-label="Conversas salvas">
      <h2 id="chat-history-title">Conversas recentes</h2>
      <div id="chat-history-list"></div>
    </div>
  </div>
</section>
<script>
const c = document.getElementById('c'), x = c.getContext('2d'), bub = document.getElementById('bubble');
const compactIsland = document.getElementById('compact-island');
const islandCollapse = document.getElementById('island-collapse');
const islandPetButton = document.getElementById('island-pet-button');
const islandNotification = document.getElementById('island-notification');
const islandTitle = document.getElementById('island-title');
const islandArtist = document.getElementById('island-artist');
const islandStatus = document.getElementById('island-status');
const chat = document.getElementById('chat'), chatMessage = document.getElementById('chat-message');
const chatTranscript = document.getElementById('chat-transcript');
const chatForm = document.getElementById('chat-form'), chatInput = document.getElementById('chat-input');
const chatSend = document.getElementById('chat-send');
const chatAttach = document.getElementById('chat-attach');
const chatNew = document.getElementById('chat-new');
const chatHistory = document.getElementById('chat-history');
const chatHistoryPanel = document.getElementById('chat-history-panel');
const chatHistoryList = document.getElementById('chat-history-list');
const chatCurrent = document.getElementById('chat-current');
const attachmentList = document.getElementById('attachments');
let CX = 48, CY = 40;
let mood = 'idle', moodT = 0, t = 0, look = { x: 0, y: 0 }, gaze = { x: 0, y: 0 };
let musicPlaying = false, musicStyle = 'calm', musicMotion = 0, musicPhase = 0;
let blinkFrames = 0, blinkCountdown = 3 + Math.random() * 3, chatOpen = false;
let pointerOver = false, characterHovered = false, hoverStartedAt = 0, hoverAmount = 0, dropAmount = 0, dropPulse = 0, affection = false, clickHistory = [];
let entranceAmount = 1, greetingTime = 0, clickAmount = 0;
let attachedFiles = [], previousFrameAt = 0, animationFramePending = false;
let activeChatRequestId = null, chatRequestSequence = 0;
let currentConversation = createConversation();
let notificationTimer;
const MAX_TRANSCRIPT_MESSAGES = 24;
const COLORS = { idle:'#d4d7d4', happy:'#d7e4d8', worried:'#e4d9c9', sad:'#d1d8df', sleepy:'#d2d2d0', thinking:'#dce2d5', annoyed:'#dfd3d0', dizzy:'#e3dfc9' };
const STICKY = ['worried', 'sleepy'];

async function startNewConversation() {
  if (activeChatRequestId) return;
  await saveCurrentConversation();
  currentConversation = createConversation();
  chatCurrent.title = 'Conversa nova';
  chatTranscript.replaceChildren();
  chatMessage.textContent = '';
  chatHistoryPanel.hidden = true;
  attachedFiles = [];
  renderAttachments();
  try { await window.api.clearAttachments(); } catch {}
  chatInput.focus();
}
function classifyMusicStyle(media) {
function createConversation() {
  const id = globalThis.crypto?.randomUUID?.() || `chat-${Date.now()}-${Math.random().toString(36).slice(2, 12)}`;
  return { id, title: 'Conversa nova', messages: [] };
}

function updateConversationTitle() {
  const firstQuestion = currentConversation.messages.find((message) => message.role === 'user')?.text || '';
  currentConversation.title = firstQuestion.replace(/\s+/g, ' ').trim().slice(0, 64) || 'Conversa com o Pip';
  chatCurrent.title = currentConversation.title;
}

async function saveCurrentConversation() {
  if (!currentConversation.messages.length) return;
  updateConversationTitle();
  try {
    await window.api.saveConversation(currentConversation);
  } catch (error) {
    chatMessage.textContent = error.message || 'Não consegui salvar esta conversa.';
  }
}

function showConversation(conversation) {
  currentConversation = {
    id: conversation.id,
    title: conversation.title || 'Conversa com o Pip',
    messages: Array.isArray(conversation.messages) ? conversation.messages : [],
  };
  chatCurrent.title = currentConversation.title;
  chatTranscript.replaceChildren();
  for (const message of currentConversation.messages) appendTranscriptMessage(message.role, message.text);
  chatMessage.textContent = 'Conversa aberta.';
  chatHistoryPanel.hidden = true;
}

async function toggleConversationHistory() {
  if (!chatHistoryPanel.hidden) {
    chatHistoryPanel.hidden = true;
    return;
  }
  chatHistoryList.replaceChildren();
  chatHistoryPanel.hidden = false;
  chatHistoryList.append(Object.assign(document.createElement('p'), {
    className: 'history-empty', textContent: 'Carregando conversas…',
  }));
  try {
    const conversations = await window.api.listConversations();
    chatHistoryList.replaceChildren();
    if (!conversations.length) {
      chatHistoryList.append(Object.assign(document.createElement('p'), {
        className: 'history-empty', textContent: 'As conversas enviadas serão salvas aqui.',
      }));
      return;
    }
    for (const conversation of conversations) {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'history-item';
      const title = document.createElement('span');
      title.className = 'history-item-title';
      title.textContent = conversation.title || 'Conversa com o Pip';
      const date = document.createElement('time');
      date.className = 'history-item-date';
      date.textContent = new Date(conversation.updatedAt).toLocaleDateString('pt-BR');
      item.append(title, date);
      item.addEventListener('click', () => showConversation(conversation));
      chatHistoryList.append(item);
    }
  } catch (error) {
    chatHistoryList.replaceChildren(Object.assign(document.createElement('p'), {
      className: 'history-empty', textContent: error.message || 'Não consegui carregar as conversas.',
    }));
  }
}
  const genres = Array.isArray(media?.genres) ? media.genres : typeof media?.genre === 'string' ? [media.genre] : [];
  const genreText = genres.join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  if (/\b(nu[ -]?metal|metalcore|deathcore|hardcore|thrash|heavy metal|hard rock|punk rock|industrial rock|grunge|metal)\b/.test(genreText)) return 'heavy';
  if (/\b(acoustic|ambient|chill|classical|lo[ -]?fi|lounge|soft rock|folk|piano|sleep|relax|new age|bossa nova|jazz|meditation|downtempo)\b/.test(genreText)) return 'calm';
  const artistText = `${media?.artist || ''} ${media?.title || ''}`.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  if (/\b(korn|slipknot|linkin park|limp bizkit|system of a down|deftones|disturbed|rammstein|sepultura|metallica|pantera|slayer|rage against the machine|bring me the horizon)\b/.test(artistText)) return 'heavy';
  return 'calm';
}

function drawHeadsetBand(cx, top, width, alpha) {
  if (alpha < 0.01) return;
  x.save();
  x.globalAlpha = alpha;
  x.lineCap = 'round';
  x.strokeStyle = '#252a28'; x.lineWidth = 4.5;
  x.beginPath(); x.moveTo(cx - width * 0.34, top + 7);
  x.bezierCurveTo(cx - width * 0.34, top - 14, cx + width * 0.34, top - 14, cx + width * 0.34, top + 7); x.stroke();
  x.strokeStyle = '#e6e9e6'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(cx - width * 0.28, top + 5);
  x.bezierCurveTo(cx - width * 0.27, top - 10, cx + width * 0.27, top - 10, cx + width * 0.28, top + 5); x.stroke();
  x.restore();
}

function drawHeadsetCups(cx, cy, width, alpha) {
  if (alpha < 0.01) return;
  x.save();
  x.globalAlpha = alpha;
  for (const side of [-1, 1]) {
    const cupX = side < 0 ? cx - width / 2 - 4 : cx + width / 2 - 5;
    const cup = x.createLinearGradient(cupX, cy - 8, cupX + 9, cy + 8);
    cup.addColorStop(0, '#262c29'); cup.addColorStop(0.5, '#555e58'); cup.addColorStop(1, '#202522');
    x.beginPath(); x.roundRect(cupX, cy - 8, 9, 17, 4); x.fillStyle = cup; x.fill();
    x.strokeStyle = '#d9ded9'; x.lineWidth = 0.8; x.stroke();
  }
  x.restore();
}

function say(text, ms = 7000) {
  if (chatOpen) { chatMessage.textContent = text; return; }
  islandNotification.textContent = text;
  document.body.classList.add('has-notification');
  clearTimeout(notificationTimer);
  if (ms > 0) notificationTimer = setTimeout(() => {
    document.body.classList.remove('has-notification');
  }, ms);
}

function updateMedia(media) {
  const title = typeof media?.title === 'string' ? media.title.trim() : '';
  const artist = typeof media?.artist === 'string' ? media.artist.trim() : '';
  const available = !!(title || artist);
  const playing = available && media?.playing === true;
  musicPlaying = playing;
  musicStyle = classifyMusicStyle(media);
  if (playing && !document.body.classList.contains('media-playing')) musicPhase = 0;
  document.body.classList.toggle('media-available', available);
  document.body.classList.toggle('media-playing', playing);
  islandTitle.textContent = title || 'Reproduzindo';
  islandArtist.textContent = artist;
  islandStatus.textContent = media?.playing ? 'TOCANDO' : 'PAUSADA';
}

function islandPoint(clientX, clientY) {
  const bounds = c.getBoundingClientRect();
  return { x: clientX - bounds.left, y: clientY - bounds.top };
}

function isPetAtClientPoint(clientX, clientY, radius = 58) {
  const point = islandPoint(clientX, clientY);
  return Math.hypot(point.x - CX, point.y - CY) < radius;
}

function movePetToChat() {
  chat.prepend(c);
  CX = 52;
  CY = window.innerHeight - 54;
}

function movePetToIsland() {
  compactIsland.prepend(c);
  CX = 48;
  CY = 40;
}

function resizeCanvas() {
  const height = Math.max(250, Math.round(window.innerHeight));
  if (c.height !== height) c.height = height;
  c.style.height = `${height}px`;
  CY = chatOpen ? height - 54 : 40;
  requestDraw();
}

function openChat() {
  if (chatOpen) return;
  chatOpen = true;
  // Keep the mascot in its familiar resting pose when the larger chat opens.
  clickAmount = 0.45;
  setMood('idle');
  movePetToChat();
  document.body.classList.add('chat-open');
  bub.style.display = 'none';
  window.api.openChat();
  requestAnimationFrame(() => chatInput.focus());
}

function cancelActiveChatRequest() {
  if (!activeChatRequestId) return false;
  window.api.cancelAsk(activeChatRequestId);
  chatInput.disabled = true;
  chatSend.disabled = true;
  chatSend.textContent = 'Cancelando…';
  chatSend.dataset.cancelling = 'true';
  chatMessage.textContent = 'Cancelando…';
  return true;
}

function closeChat() {
  if (!chatOpen) return;
  cancelActiveChatRequest();
  chatOpen = false;
  movePetToIsland();
  document.body.classList.remove('chat-open');
  window.api.closeChat();
}

function appendTranscriptMessage(role, text) {
  if (typeof text !== 'string' || !text) return;
  const entry = document.createElement('div');
  entry.className = `chat-entry chat-entry-${role}`;
  const label = document.createElement('span');
  label.className = 'chat-entry-label';
  label.textContent = role === 'user' ? 'Você' : 'Pip';
  const message = document.createElement('span');
  message.textContent = text;
  entry.append(label, message);
  chatTranscript.append(entry);
  while (chatTranscript.childElementCount > MAX_TRANSCRIPT_MESSAGES) chatTranscript.firstElementChild.remove();
  chatTranscript.scrollTop = chatTranscript.scrollHeight;
}

function renderAttachments() {
  attachmentList.replaceChildren();
  for (const file of attachedFiles) {
    const chip = document.createElement('span');
    chip.className = 'attachment';
    const name = document.createElement('span');
    name.className = 'attachment-name';
    name.textContent = file.name;
    const remove = document.createElement('button');
    remove.className = 'attachment-remove';
    remove.type = 'button';
    remove.textContent = '×';
    remove.setAttribute('aria-label', `Remover ${file.name}`);
    remove.addEventListener('click', async () => {
      try {
        await window.api.clearAttachments();
        attachedFiles = [];
        renderAttachments();
      } catch (error) {
        chatMessage.textContent = error.message || 'Não consegui remover o arquivo.';
      }
    });
    chip.append(name, remove);
    attachmentList.append(chip);
  }
}

async function attachFiles(result) {
  try {
    const files = await result;
    if (!files.length) return;
    attachedFiles = files;
    renderAttachments();
    openChat();
    chatMessage.textContent = files.length === 1
      ? `${files[0].name} anexado. Faça uma pergunta sobre o arquivo.`
      : `${files.length} arquivos anexados. Faça uma pergunta sobre eles.`;
    setMood('happy');
  } catch (error) {
    setMood('worried');
    say(error.message || 'Não consegui anexar esse arquivo.', 6000);
  }
}

function isFileDropTarget(event) {
  return chat.contains(event.target) || compactIsland.contains(event.target) || isPetAtClientPoint(event.clientX, event.clientY);
}

document.addEventListener('dragover', (event) => {
  if (!Array.from(event.dataTransfer?.types || []).includes('Files')) return;
  event.preventDefault();
  const wasDraggingOverPip = document.body.classList.contains('file-dragging');
  const accepted = chatOpen || isFileDropTarget(event);
  document.body.classList.toggle('file-dragging', accepted);
  if (accepted) document.body.classList.add('island-expanded');
  if (accepted && !wasDraggingOverPip) dropPulse = 1;
  if (accepted) event.dataTransfer.dropEffect = 'copy';
});
document.addEventListener('dragleave', (event) => {
  if (!event.relatedTarget || !document.documentElement.contains(event.relatedTarget)) {
    document.body.classList.remove('file-dragging');
  }
});
document.addEventListener('drop', (event) => {
  if (!event.dataTransfer?.files?.length) return;
  event.preventDefault();
  document.body.classList.remove('file-dragging');
  if (!chatOpen && !isFileDropTarget(event)) return;
  attachFiles(window.api.attachFiles(Array.from(event.dataTransfer.files)));
});

window.api.onEvent((e) => {
  switch (e.type) {
    case 'hello': entranceAmount = 0; greetingTime = 1.6; setMood('happy'); say('Oi! Estou aqui quando você precisar.', 4500); break;
    case 'cursor': {
      const point = islandPoint(e.x, e.y);
      look = { x: Math.max(-180, Math.min(180, point.x - CX)), y: Math.max(-100, Math.min(120, point.y - CY)) };
      break;
    }
    case 'worried': setMood('worried'); if (e.text) say(e.text, 6000); break;
    case 'relieved': if (mood === 'worried') { setMood('happy'); say('Sem erros agora!', 3000); } break;
    case 'saved': if (!STICKY.includes(mood)) setMood('happy'); break;
    case 'happy': setMood('happy'); say(e.text || 'Passou!', 4000); break;
    case 'sad': setMood('sad'); say(e.text || 'Falhou. Quer ajuda?', 5000); break;
    case 'sleepy': setMood('sleepy'); break;
    case 'wake': if (mood === 'sleepy') setMood('idle'); break;
    case 'thinking': setMood('thinking'); say(e.text || 'Pensando…', 30000); break;
    case 'cancelled': setMood('idle'); if (chatOpen) chatMessage.textContent = 'Parei por aqui.'; break;
    case 'answer':
      setMood('happy');
      if (chatOpen) appendTranscriptMessage('pip', e.text);
      else say(e.text);
      break;
    case 'chat-opened': resizeCanvas(); chatInput.focus(); break;
    case 'chat-dismissed':
      chatOpen = false;
      movePetToIsland();
      document.body.classList.remove('chat-open');
      resizeCanvas();
      break;
    case 'media': updateMedia(e.media); break;
  }
});

islandCollapse.addEventListener('click', (event) => {
  event.stopPropagation();
  document.body.classList.remove('island-expanded');
});
islandPetButton.addEventListener('click', (event) => {
  event.stopPropagation();
  openChat();
});

document.addEventListener('mousemove', (e) => {
  const onPetSurface = chatOpen ? chat.contains(e.target) : compactIsland.contains(e.target);
  const point = islandPoint(e.clientX, e.clientY);
  const onCharacter = onPetSurface && Math.hypot(point.x - CX, point.y - CY) < 74;
  const over = compactIsland.contains(e.target) || bub.contains(e.target) || chat.contains(e.target);
  if (over !== pointerOver) {
    pointerOver = over;
    window.api.setInteractive(over);
  }
  if (onCharacter !== characterHovered) {
    characterHovered = onCharacter;
    hoverStartedAt = onCharacter ? Date.now() : 0;
    if (!onCharacter) affection = false;
  }
  if (characterHovered && hoverStartedAt && Date.now() - hoverStartedAt >= 2000) affection = true;
});
document.addEventListener('click', (event) => {
  if (compactIsland.contains(event.target)) {
    if (document.body.classList.contains('island-expanded')
      && isPetAtClientPoint(event.clientX, event.clientY, 54)) {
      clickAmount = 1;
      openChat();
    }
    document.body.classList.add('island-expanded');
    return;
  }
});
bub.addEventListener('click', () => { bub.style.display = 'none'; });
document.getElementById('chat-close').addEventListener('click', closeChat);
chatNew.addEventListener('click', startNewConversation);
chatHistory.addEventListener('click', toggleConversationHistory);
document.getElementById('chat-settings').addEventListener('click', () => {
  cancelActiveChatRequest();
  window.api.openSettings();
});
chatAttach.addEventListener('click', () => attachFiles(window.api.chooseFiles()));
chatForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (activeChatRequestId) { cancelActiveChatRequest(); return; }
  const question = chatInput.value.trim();
  if (!question || chatInput.disabled) return;
  const requestId = `pip-overlay-chat-${Date.now()}-${++chatRequestSequence}`;
  activeChatRequestId = requestId;
  chatInput.disabled = true;
  chatNew.disabled = true;
  chatHistory.disabled = true;
  chatAttach.disabled = true;
  chatSend.disabled = false;
  chatSend.textContent = 'Cancelar';
  chatSend.dataset.cancelling = 'false';
  currentConversation.messages.push({ role: 'user', text: question });
  await saveCurrentConversation();
  chatInput.value = '';
  chatMessage.textContent = 'Pensando…';
  setMood('thinking');
  try {
    const result = await window.api.ask(question, requestId, currentConversation.id);
    if (result.cancelled) {
      currentConversation.messages.push({ role: 'pip', text: result.text || 'Parei por aqui.' });
      appendTranscriptMessage('pip', result.text || 'Parei por aqui.');
      await saveCurrentConversation();
      setMood('idle');
      chatMessage.textContent = result.text || 'Parei por aqui.';
      return;
    }
    currentConversation.messages.push({ role: 'pip', text: result.text || '' });
    appendTranscriptMessage('pip', result.text);
    await saveCurrentConversation();
    setMood(result.ok === false ? 'sad' : 'joy');
    chatMessage.textContent = result.ok === false ? result.text : 'Sua vez.';
  } catch (error) {
    setMood('sad');
    const message = error.message || 'Não consegui enviar a pergunta.';
    currentConversation.messages.push({ role: 'pip', text: message });
    appendTranscriptMessage('pip', message);
    await saveCurrentConversation();
    chatMessage.textContent = 'A pergunta não foi enviada.';
  } finally {
    activeChatRequestId = null;
    chatInput.disabled = false;
    chatNew.disabled = false;
    chatHistory.disabled = false;
    chatAttach.disabled = false;
    chatSend.disabled = false;
    chatSend.textContent = '↑';
    chatSend.dataset.cancelling = 'false';
    chatInput.value = '';
    chatInput.focus();
  }
});
document.addEventListener('keydown', (event) => {
  if (!chatOpen) return;
  if (event.key === 'Escape') { event.preventDefault(); closeChat(); }
  else if (event.target === chatInput && event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    chatForm.requestSubmit();
  }
});

function draw(timestamp) {
  animationFramePending = false;
  if (document.visibilityState === 'hidden') {
    previousFrameAt = timestamp;
    return;
  }
  const elapsed = previousFrameAt ? Math.max(0, (timestamp - previousFrameAt) / 1000) : 1 / 60;
  const easing = 1 - Math.exp(-elapsed * 10);
  previousFrameAt = timestamp;
  t += elapsed; moodT += elapsed;
  musicMotion += ((musicPlaying ? 1 : 0) - musicMotion) * (1 - Math.exp(-elapsed * 3.5));
  if (musicPlaying) musicPhase += elapsed;
  if (characterHovered && hoverStartedAt && !affection && Date.now() - hoverStartedAt >= 2000) affection = true;
  hoverAmount += ((characterHovered ? 1 : 0) - hoverAmount) * easing;
  const dropTarget = document.body.classList.contains('file-dragging') ? 1 : 0;
  dropAmount += (dropTarget - dropAmount) * (1 - Math.exp(-elapsed * (dropTarget ? 7 : 5)));
  dropPulse *= Math.exp(-elapsed * 4.5);
  if (!STICKY.includes(mood) && mood !== 'thinking' && moodT > 3) setMood('idle');
  x.clearRect(0, 0, 640, 250);
  let ox = 0, oy = (1 - entranceAmount) * -38, sy = 1 + Math.sin(t * 2) * 0.025, musicTilt = 0;
  entranceAmount += (1 - entranceAmount) * (1 - Math.exp(-elapsed * 7));
  greetingTime = Math.max(0, greetingTime - elapsed);
  clickAmount += (0 - clickAmount) * (1 - Math.exp(-elapsed * 14));
  if (mood === 'happy') oy = -Math.abs(Math.sin(moodT * 9)) * 18 * Math.max(0, 1 - moodT / 1.2);
  if (mood === 'worried') ox = Math.sin(t * 40) * 1.5;
  if (mood === 'sleepy') sy = 0.9 + Math.sin(t) * 0.03;
  if (musicMotion > 0.01) {
    if (musicStyle === 'heavy') {
      const headBeat = Math.sin(musicPhase * 8.5);
      const downstroke = Math.max(0, headBeat);
      oy += headBeat * 4.5 * musicMotion;
      sy *= 1 - downstroke * 0.09 * musicMotion;
    } else {
      const nod = Math.sin(musicPhase * 4.2);
      oy += nod * 2.5 * musicMotion;
      sy *= 1 + Math.cos(musicPhase * 4.2) * 0.018 * musicMotion;
      musicTilt = nod * 0.045 * musicMotion;
    }
  }
  const receiveLift = Math.sin((1 - dropPulse) * Math.PI) * dropPulse * 4;
  const w = 64 + hoverAmount * 2 + clickAmount * 4 + dropPulse * 2;
  const h = (42 + hoverAmount * 2) * sy * (1 - clickAmount * 0.12) * (1 - dropPulse * 0.06);
  const cx = CX + ox, cy = CY + oy + (42 - h) / 2 - receiveLift;
  const shellRadius = h * 0.34;
  x.save(); x.translate(cx, cy); x.rotate(musicTilt); x.translate(-cx, -cy);
  if (musicStyle === 'calm') drawHeadsetBand(cx, cy - h / 2, w, musicMotion);
  if (greetingTime > 0 && dropAmount < 0.1) {
    const wave = Math.sin((1.6 - greetingTime) * 13) * Math.min(1, greetingTime * 2);
    x.strokeStyle = '#c7d4c8'; x.lineWidth = 5; x.lineCap = 'round';
    x.beginPath(); x.moveTo(cx + 39, cy + 12); x.quadraticCurveTo(cx + 54, cy + 10 + wave * 7, cx + 49, cy - 3 + wave * 13); x.stroke();
    x.fillStyle = '#e2e9e2'; x.beginPath(); x.arc(cx + 49, cy - 3 + wave * 13, 4, 0, Math.PI * 2); x.fill();
  }
  const top = cy - h / 2, bottom = cy + h / 2, left = cx - w / 2, right = cx + w / 2;
  const shell = x.createLinearGradient(cx, top, cx, bottom);
  shell.addColorStop(0, '#ffffff'); shell.addColorStop(0.16, '#f4f6f3'); shell.addColorStop(0.55, COLORS[mood]); shell.addColorStop(1, '#929994');
  x.fillStyle = shell;
  x.shadowColor = '#00000055'; x.shadowBlur = 11; x.shadowOffsetY = 5;
  x.beginPath(); x.roundRect(left, top, w, h, shellRadius); x.fill();
  x.save();
  x.beginPath(); x.roundRect(left, top, w, h, shellRadius); x.clip();
  const highlight = x.createRadialGradient(cx - w * 0.28, top + h * 0.18, 1, cx - w * 0.28, top + h * 0.18, w * 0.72);
  highlight.addColorStop(0, '#ffffffa8'); highlight.addColorStop(0.42, '#ffffff38'); highlight.addColorStop(1, '#ffffff00');
  x.fillStyle = highlight; x.fillRect(left, top, w, h);
  const sideShade = x.createLinearGradient(left, cy, right, cy);
  sideShade.addColorStop(0, '#ffffff00'); sideShade.addColorStop(0.72, '#61686108'); sideShade.addColorStop(1, '#343a3540');
  x.fillStyle = sideShade; x.fillRect(left, top, w, h);
  x.restore();
  x.shadowColor = 'transparent'; x.shadowBlur = 0; x.shadowOffsetY = 0;
  x.strokeStyle = '#747c7580'; x.lineWidth = 1;
  x.beginPath(); x.roundRect(left, top, w, h, shellRadius); x.stroke();
  x.strokeStyle = '#ffffffa0'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(left + shellRadius, top + 1); x.quadraticCurveTo(cx, top - 0.5, right - shellRadius, top + 1); x.stroke();
  if (musicStyle === 'calm') drawHeadsetCups(cx, cy, w, musicMotion);
  if (dropAmount > 0.01) {
    const opening = dropAmount * dropAmount * (3 - 2 * dropAmount);
    const halfMouth = 17 * opening;
    const cavity = x.createLinearGradient(cx, top + 1, cx, top + 13 * opening);
    cavity.addColorStop(0, '#343a36'); cavity.addColorStop(1, '#111512');
    x.beginPath(); x.moveTo(cx - halfMouth, top + 1);
    x.quadraticCurveTo(cx, top + 5 * opening, cx + halfMouth, top + 1);
    x.lineTo(cx + halfMouth, top + 4 * opening);
    x.quadraticCurveTo(cx, top + 12 * opening, cx - halfMouth, top + 4 * opening);
    x.closePath(); x.fillStyle = cavity; x.fill();
    x.shadowColor = '#00000038'; x.shadowBlur = 4 * opening; x.shadowOffsetY = 2 * opening;
    for (const side of [-1, 1]) {
      const flap = x.createLinearGradient(cx, top - 10 * opening, cx + side * 28 * opening, top + 5 * opening);
      flap.addColorStop(0, side < 0 ? '#fbfcfa' : '#e1e5e1');
      flap.addColorStop(0.55, side < 0 ? '#d8ddd8' : '#c4cbc5');
      flap.addColorStop(1, side < 0 ? '#a5ada6' : '#939c95');
      x.beginPath(); x.moveTo(cx, top + 2 * opening);
      x.bezierCurveTo(cx + side * 8 * opening, top - 3 * opening, cx + side * 20 * opening, top - 11 * opening, cx + side * 28 * opening, top - 5 * opening);
      x.bezierCurveTo(cx + side * 25 * opening, top + 1 * opening, cx + side * 13 * opening, top + 5 * opening, cx + side * 2 * opening, top + 5 * opening);
      x.closePath(); x.fillStyle = flap; x.fill();
      x.strokeStyle = side < 0 ? '#ffffffc0' : '#6f787180'; x.lineWidth = 0.9; x.stroke();
    }
    x.shadowColor = 'transparent'; x.shadowBlur = 0; x.shadowOffsetY = 0;
  }
  if (affection) {
    for (const s of [-1, 1]) {
      const hx = cx + s * (20 + Math.sin(t * 2 + s) * 3);
      const hy = cy - 29 - (t * 10 % 8);
      x.save(); x.translate(hx, hy); x.scale(0.7, 0.7);
      x.fillStyle = '#f08fa6'; x.beginPath(); x.moveTo(0, 5); x.bezierCurveTo(-13, -3, -8, -12, 0, -6); x.bezierCurveTo(8, -12, 13, -3, 0, 5); x.fill();
      x.restore();
    }
  }
  if (blinkFrames > 0) blinkFrames = Math.max(0, blinkFrames - elapsed);
  else if ((blinkCountdown -= elapsed) <= 0) {
    blinkFrames = 7 / 60;
    blinkCountdown = 3.5 + Math.random() * 4;
  }
  const closed = mood === 'sleepy' || blinkFrames > 0 || mood === 'annoyed';
  const eyeBob = musicMotion > 0.01
    ? Math.sin(musicPhase * (musicStyle === 'heavy' ? 8.5 : 4.2)) * (musicStyle === 'heavy' ? 2.8 : 1.5) * musicMotion
    : Math.sin(t * 2.4) * 0.8;
  for (const s of [-1, 1]) {
    const ex = cx + s * 14, ey = cy - 3 + dropAmount * 5 + eyeBob;
    const eyeWidth = 4.2 + hoverAmount * 0.3, eyeHeight = 7.2 + hoverAmount * 0.3;
    x.fillStyle = '#111312'; x.strokeStyle = '#111312'; x.lineWidth = 2; x.lineCap = 'round';
    if (closed) {
      x.beginPath();
      if (mood === 'happy') x.arc(ex, ey + 2, 5, Math.PI, Math.PI * 2);
      else { x.moveTo(ex - 4, ey); x.lineTo(ex + 4, ey); }
      x.stroke();
    } else {
      x.beginPath(); x.ellipse(ex, ey, eyeWidth, eyeHeight, 0, 0, 7); x.fill();
      x.fillStyle = '#ffffffb0'; x.beginPath(); x.arc(ex - 1.1, ey - 2.5, 1.15, 0, Math.PI * 2); x.fill();
    }
  }
  x.restore();
  requestDraw();
}

function requestDraw() {
  if (document.visibilityState === 'hidden' || animationFramePending) return;
  animationFramePending = true;
  requestAnimationFrame(draw);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    entranceAmount = 0;
    greetingTime = 1.6;
    requestDraw();
  }
});
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
requestDraw();
</script>
